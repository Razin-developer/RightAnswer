<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Right Answer — Cost/Margin Dashboard</title>
<meta name="robots" content="noindex" />
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; background: #141413; color: #faf9f5; margin: 0; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: #8e8b82; font-size: 13px; margin: 0 0 20px; }
  .row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .card { background: #1f1e1b; border: 1px solid #2e2c28; border-radius: 10px; padding: 14px 18px; min-width: 160px; }
  .card .label { font-size: 11px; color: #8e8b82; text-transform: uppercase; letter-spacing: .04em; }
  .card .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 24px; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #2e2c28; }
  th { color: #8e8b82; font-weight: 500; }
  .token-bar { display: flex; gap: 8px; margin-bottom: 20px; }
  input { background: #1f1e1b; border: 1px solid #2e2c28; color: #faf9f5; border-radius: 6px; padding: 8px 10px; flex: 1; font-size: 13px; }
  button { background: #cc785c; border: none; color: #141413; border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer; font-weight: 600; }
  .note { color: #8e8b82; font-size: 12px; margin: 4px 0; }
  .err { color: #e5735c; font-size: 13px; }
</style>
</head>
<body>
  <h1>Cost / Margin Dashboard</h1>
  <p class="sub">Admin-only. Paste a bearer token from an admin account below (stored only in this browser's localStorage).</p>
  <div class="token-bar">
    <input id="token" type="password" placeholder="Bearer token" />
    <button onclick="load()">Load</button>
  </div>
  <div id="content"></div>

<script>
const KEY = 'ra_admin_token';
const tokenInput = document.getElementById('token');
tokenInput.value = localStorage.getItem(KEY) || '';

async function load() {
  const token = tokenInput.value.trim();
  localStorage.setItem(KEY, token);
  const content = document.getElementById('content');
  content.innerHTML = '<p class="note">Loading…</p>';
  try {
    const res = await fetch('/api/admin/metrics', {
      headers: { Authorization: 'Bearer ' + token },
    });
    const data = await res.json();
    if (!res.ok) {
      content.innerHTML = '<p class="err">' + (data.error?.message || res.status) + '</p>';
      return;
    }
    render(data.data);
  } catch (e) {
    content.innerHTML = '<p class="err">' + e + '</p>';
  }
}

function fmt(n) { return '$' + Number(n || 0).toFixed(2); }

function render(d) {
  const t = d.totals || {};
  let html = '<div class="row">'
    + card('Cost (30d)', fmt(t.costUsd30d))
    + card('Revenue proxy (30d)', fmt(t.revenueUsd30d))
    + card('Margin proxy (30d)', fmt(t.marginUsd30d))
    + '</div>';

  html += '<h3>Cost by plan</h3>' + table(
    ['Plan', 'Calls', 'Cost'],
    (d.costByPlan || []).map(r => [r.plan || 'unknown', r.apiCalls, fmt(r.estimatedCostUsd)]),
  );

  html += '<h3>Daily cost (30d)</h3>' + table(
    ['Day', 'Calls', 'Cost'],
    (d.dailyCostUsd || []).map(r => [r.day, r.apiCalls, fmt(r.estimatedCostUsd)]),
  );

  html += '<h3>Daily revenue proxy (30d)</h3>' + table(
    ['Day', 'Plan', 'Amount'],
    (d.dailyRevenueUsd || []).map(r => [r.day, r.plan, fmt(r.amountUsd)]),
  );

  html += '<h3>Cost by model</h3>' + table(
    ['Model', 'Provider', 'Calls', 'In tok', 'Out tok', 'Cost'],
    (d.aiUsage || []).map(r => [r.model, r.provider, r.apiCalls, r.inputTokens, r.outputTokens, fmt(r.estimatedCostUsd)]),
  );

  html += '<h3>Cost by user</h3>' + table(
    ['User', 'Calls', 'In tok', 'Out tok', 'Cost'],
    (d.userUsage || []).map(r => [r.email || r.userId || 'unknown', r.apiCalls, r.inputTokens, r.outputTokens, fmt(r.estimatedCostUsd)]),
  );

  (d.notes || []).forEach(n => { html += '<p class="note">' + n + '</p>'; });

  document.getElementById('content').innerHTML = html;
}

function card(label, value) {
  return '<div class="card"><div class="label">' + label + '</div><div class="value">' + value + '</div></div>';
}

function table(cols, rows) {
  let html = '<table><thead><tr>' + cols.map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>';
  if (!rows.length) html += '<tr><td colspan="' + cols.length + '" class="note">No data</td></tr>';
  rows.forEach(r => { html += '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>'; });
  html += '</tbody></table>';
  return html;
}

if (tokenInput.value) load();
</script>
</body>
</html>
